<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramação de Elemento</title>
    <style>
        .container {
            width: 400px;
            border: 5px solid black;
            height: 600px;
            text-align: center;
        }

        img {
            width: 100px;
            height: 100px;
            background-color: dodgerblue;
        }

        span {
            font-size: 20px;
            vertical-align: top;
        }

        .item1 {
            width: 150px;
            height: 150px;
            background-color: rgba(0, 0, 255);
            display: inline-block;
        }

        .item2 {
            width: 150px;
            height: 150px;
            background-color: rgba(255, 0, 0);
            display: inline-block;
        }
    </style>

</head>

<body>
    <div class="container">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Delectus excepturi fugiat veniam repellendus magni
            minus explicabo accusantium similique expedita vitae eveniet nam laudantium, mollitia ipsam libero, aliquam
            est illum? Libero.
        </p>
        <button>Lorem</button>
        <div>
            <img>
            <span>Exemplo vertical-align</span>
        </div>
        <div class="item1">ITEM 1</div>
        <div class="item2">ITEM 2</div>
    </div>
</body>

</html>
