<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos - Aulas 2</title>
</head>
<body>
    <div style="border: 1px solid black; padding: 10px; text-align: center;">
        <h2 style="text-align:center">Notícia do dia</h2>
        <p style="font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;">Hoje tivemos um evento importante...</p> 
        <p>Este é um <span style="color: red; font-size: 100px;"> aviso importante</span> no meio do texto.</p>
    </div>
    <hr>
    <header>
        <B>HEADER</B> - <i>CABEÇALHO</i>
    </header>
    <main>
       <strong>MAIN</strong> - <em>PARTE PRINCIPAL</em>
    </main>
    <footer>
        FOOTER - RODAPÉ
    </footer>  
    H<sub>2</sub>O 
    <br>
    E = mc<sup>2</sup>
    <br> 
    <hr> 
    <p style="text-align: left;">Texto alinhado á esquerda.</p>
    <p style="text-align: center;">Texto centralizado.</p>
    <p style="text-align: right;">Texto alinhado à direita.</p>
    <p style="text-align: justify;">Texto justificado, preechendo a largura da linha.</p>
</body>
</html>
